moneypoly:
  version: @project.version@
  openiban:
    base-url: ${MONEYPOLY_OPENIBAN_BASE_URL:https://openiban.com}
  banksync:
    crypto-key: ${MONEYPOLY_CRYPTO_KEY:}
    scheduling:
      enabled: ${MONEYPOLY_BANKSYNC_SCHEDULING_ENABLED:true}
    cron: ${MONEYPOLY_BANKSYNC_CRON:0 0 3 * * *}
    enable-banking:
      base-url: ${MONEYPOLY_ENABLE_BANKING_BASE_URL:https://api.enablebanking.com}
      app-id: ${MONEYPOLY_ENABLE_BANKING_APP_ID:}
      token: ${MONEYPOLY_ENABLE_BANKING_TOKEN:}
      private-key: ${MONEYPOLY_ENABLE_BANKING_PRIVATE_KEY:}
      private-key-path: ${MONEYPOLY_ENABLE_BANKING_PRIVATE_KEY_PATH:}
      consent-days: ${MONEYPOLY_ENABLE_BANKING_CONSENT_DAYS:180}
    yaxi:
      base-url: ${MONEYPOLY_YAXI_BASE_URL:https://api.yaxi.tech}
      api-key: ${MONEYPOLY_YAXI_API_KEY:}
  logging:
    tcp:
      enabled: ${LOGGING_TCP_ENABLED:false}
      host: ${LOGGING_TCP_HOST:127.0.0.1}
      port: ${LOGGING_TCP_PORT:4560}
      destinations: ${LOGGING_TCP_DESTINATIONS:${LOGGING_TCP_HOST:127.0.0.1}:${LOGGING_TCP_PORT:4560}}

spring:
  application:
    name: moneypoly

  datasource:
    url: ${MONEYPOLY_DB_URL:jdbc:postgresql://localhost:5432/moneypoly}
    username: ${MONEYPOLY_DB_USER:moneypoly}
    password: ${MONEYPOLY_DB_PASSWORD:moneypoly}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

vaadin:
  # Kein automatisches Öffnen des Browsers (Headless/Server-Betrieb)
  launch-browser: false
