moneypoly:
  version: @project.version@

spring:
  application:
    name: moneypoly

  datasource:
    url: ${MONEYPOLY_DB_URL:jdbc:postgresql://localhost:5432/moneypoly}
    username: ${MONEYPOLY_DB_USER:moneypoly}
    password: ${MONEYPOLY_DB_PASSWORD:moneypoly}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

server:
  port: 8080

vaadin:
  # Kein automatisches Öffnen des Browsers (Headless/Server-Betrieb)
  launch-browser: false
