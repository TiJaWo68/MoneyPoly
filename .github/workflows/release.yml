name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build production artifact
        run: mvn --batch-mode clean package -Pproduction -DskipTests

      - name: Prepare release artifacts
        run: |
          cp target/moneypoly-*.jar target/moneypoly.jar
          cd target && sha256sum moneypoly.jar > moneypoly.jar.sha256 && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/moneypoly.jar
            target/moneypoly.jar.sha256
          generate_release_notes: true
